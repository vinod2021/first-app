spring.application.name=quiz



# ==================================
# DataSource Configuration
# ==================================
spring.datasource.url=jdbc:mysql://localhost:3306/learn_db
spring.datasource.username=root
spring.datasource.password=Kartik@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================================
# JPA / Hibernate Configuration
# ==================================
# Dialect: Standard for Hibernate 6+ / Spring Boot 3+. 
# (Use org.hibernate.dialect.MySQL8Dialect only for older Spring Boot 2.x / Hibernate 5.x)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# DDL Auto Generation: Options are 'none', 'validate', 'update', 'create', 'create-drop'
# Use 'update' or 'create-drop' for development; 'validate' or 'none' for production
spring.jpa.hibernate.ddl-auto=update

# Print formatted SQL queries to the console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Keep connection active
spring.jpa.open-in-view=false
